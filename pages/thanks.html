<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're a Natarta Guardian</title>
  <meta name="description" content="Thank you for supporting Natarta. You are a Guardian." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a1628; color: #e8eef7; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      background: #12233a; border: 1px solid #1e3a5f; border-radius: 20px; padding: 36px 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px;
      background: linear-gradient(135deg, #3ec7d9, #e8c35a);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    h1 { font-size: 1.45rem; font-weight: 650; margin: 0 0 10px; letter-spacing: -0.02em; }
    p { margin: 0 0 14px; line-height: 1.45; color: #b7c5d8; font-size: 1rem; }
    .name { color: #7dd3e8; font-weight: 600; }
    a.btn {
      display: inline-block; margin-top: 10px; padding: 14px 22px; border-radius: 999px;
      text-decoration: none; font-weight: 600; color: #0a1628;
      background: linear-gradient(90deg, #3ec7d9, #e8c35a);
    }
    .fine { margin-top: 18px; font-size: 0.8rem; color: #7a8aa0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">🛡</div>
    <h1>Guardian · thank you</h1>
    <p>You just helped keep Natarta free for everyone. That makes you a <span class="name">Guardian</span> in this community.</p>
    <p>Your tip keeps the checks honest, private, and always on.</p>
    <a class="btn" href="natarta://guardian">Open Natarta</a>
    <p class="fine">If the app does not open, return to Natarta on your phone. You are already a Guardian there.</p>
  </main>
</body>
</html>
